<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoXLR Mini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lg-bg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2334343c%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23101014%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22lg-a%22%20x1%3D%220%22%20y1%3D%221%22%20x2%3D%220%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%235E5CE6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2364D2FF%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22lg-b%22%20x1%3D%220%22%20y1%3D%221%22%20x2%3D%220%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF375F%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FF9F0A%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20x%3D%222%22%20y%3D%222%22%20width%3D%2260%22%20height%3D%2260%22%20rx%3D%2216%22%20fill%3D%22url(%23lg-bg)%22%2F%3E%3Crect%20x%3D%222.5%22%20y%3D%222.5%22%20width%3D%2259%22%20height%3D%2259%22%20rx%3D%2215.5%22%20fill%3D%22none%22%20stroke%3D%22rgba(255%2C255%2C255%2C.14)%22%2F%3E%3Cg%3E%3Crect%20x%3D%2214%22%20y%3D%2214%22%20width%3D%226%22%20height%3D%2236%22%20rx%3D%223%22%20fill%3D%22%23000%22%20opacity%3D%22.55%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2230%22%20width%3D%226%22%20height%3D%2220%22%20rx%3D%223%22%20fill%3D%22url(%23lg-a)%22%2F%3E%3Crect%20x%3D%2211%22%20y%3D%2227%22%20width%3D%2212%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2214%22%20width%3D%226%22%20height%3D%2236%22%20rx%3D%223%22%20fill%3D%22%23000%22%20opacity%3D%22.55%22%2F%3E%3Crect%20x%3D%2225%22%20y%3D%2221%22%20width%3D%226%22%20height%3D%2229%22%20rx%3D%223%22%20fill%3D%22url(%23lg-b)%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2218%22%20width%3D%2212%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2214%22%20width%3D%226%22%20height%3D%2236%22%20rx%3D%223%22%20fill%3D%22%23000%22%20opacity%3D%22.55%22%2F%3E%3Crect%20x%3D%2236%22%20y%3D%2236%22%20width%3D%226%22%20height%3D%2214%22%20rx%3D%223%22%20fill%3D%22url(%23lg-a)%22%2F%3E%3Crect%20x%3D%2233%22%20y%3D%2233%22%20width%3D%2212%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%2247%22%20y%3D%2214%22%20width%3D%226%22%20height%3D%2236%22%20rx%3D%223%22%20fill%3D%22%23000%22%20opacity%3D%22.55%22%2F%3E%3Crect%20x%3D%2247%22%20y%3D%2226%22%20width%3D%226%22%20height%3D%2224%22%20rx%3D%223%22%20fill%3D%22url(%23lg-b)%22%2F%3E%3Crect%20x%3D%2244%22%20y%3D%2223%22%20width%3D%2212%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#09090c; --side:rgba(22,22,26,.78); --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
  --stroke:rgba(255,255,255,.075); --stroke2:rgba(255,255,255,.13);
  --text:#f5f5f7; --text2:rgba(235,235,245,.62); --text3:rgba(235,235,245,.34);
  --accent:#0A84FF; --red:#FF453A; --green:#30D158; --yellow:#FFD60A; --orange:#FF9F0A;
  --r:20px; --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Segoe UI Variable Display","Segoe UI Variable Text","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
  font-size:13px;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;transition:background 1.2s var(--ease)}
#app{position:relative;z-index:1;display:grid;grid-template-columns:232px 1fr;height:100%}
/* barre laterale */
aside{background:var(--side);backdrop-filter:blur(40px) saturate(1.4);border-right:1px solid var(--stroke);display:flex;flex-direction:column;padding:22px 14px 16px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 22px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em;display:block}
.brand small{color:var(--text3);font-size:11.5px}
nav{display:flex;flex-direction:column;gap:3px}
nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--text2);font-size:13.5px;font-weight:500;transition:background .2s,color .2s;position:relative}
nav button svg{width:19px;height:19px}
nav button:hover{background:rgba(255,255,255,.045);color:var(--text)}
nav button.on{background:rgba(255,255,255,.085);color:var(--text)}
nav button.on svg{color:var(--accent)}
nav .badge{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#1a1000;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--stroke)}
.conn{display:flex;align-items:center;gap:9px;font-weight:600;font-size:12.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,69,58,.15)}
.dot.ok{background:var(--green);box-shadow:0 0 0 4px rgba(48,209,88,.15)}
.side-foot small{display:block;color:var(--text3);font-size:11px;margin-top:6px;line-height:1.5}
/* zone principale */
main{position:relative;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 34px 14px}
header h1{font-size:26px;font-weight:700;letter-spacing:-.025em}
header p{color:var(--text2);font-size:13px;margin-top:3px}
.hdr-actions{display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:17px;background:var(--card2);border:1px solid var(--stroke);font-weight:600;font-size:12.5px;transition:all .2s var(--ease)}
.pill svg{width:16px;height:16px}
.pill:hover{background:rgba(255,255,255,.1)}
.pill.danger{background:rgba(255,69,58,.16);border-color:rgba(255,69,58,.4);color:#ff6b61}
.pill.primary{background:var(--accent);border-color:transparent;color:#fff}
.pill.primary:hover{filter:brightness(1.1)}
.page{position:absolute;inset:86px 0 0 0;padding:6px 34px 30px;overflow:hidden;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.page.on{opacity:1;transform:none;pointer-events:auto}
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:18px}
.card h3{font-size:13px;font-weight:650;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 small{color:var(--text3);font-weight:500;margin-left:auto;font-size:11.5px}
.muted-txt{color:var(--text2)}
/* faders */
.strips{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;height:420px}
.strip{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 14px 14px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid var(--stroke);transition:border-color .3s}
.strip.is-muted{border-color:rgba(255,69,58,.28)}
.strip-head{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:14px;transition:background .2s}
.strip-head:hover{background:rgba(255,255,255,.06)}
.chip-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);flex:none}
.chip-ico svg{width:19px;height:19px}
.strip-head .nm{font-weight:650;font-size:14.5px;text-align:left;line-height:1.15}
.strip-head .nm small{display:block;color:var(--text3);font-size:11px;font-weight:500}
.strip-head .chev{margin-left:auto;width:14px;height:14px;color:var(--text3)}
.sl{position:relative;touch-action:none}
.sl-track{position:relative;overflow:hidden;background:rgba(255,255,255,.07);cursor:pointer}
.sl-fill{position:absolute;left:0;bottom:0;background:var(--c);transition:height .14s var(--ease),width .14s var(--ease)}
.sl.active .sl-fill,.sl.active .sl-knob{transition:none}
.sl.v .sl-track{width:78px;height:252px;border-radius:24px}
.sl.v .sl-fill{width:100%;background:linear-gradient(0deg,color-mix(in srgb,var(--c) 55%,#000),var(--c));box-shadow:0 0 36px color-mix(in srgb,var(--c) 40%,transparent)}
.sl.v .sl-fill::after{content:"";position:absolute;left:22px;right:22px;top:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.75)}
.sl.v .sl-knob{display:none}
.sl.h .sl-track{height:8px;border-radius:4px;overflow:visible}
.sl.h .sl-fill{top:0;height:100%;border-radius:4px}
.sl.h .sl-knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45);transition:left .14s var(--ease)}
.sl.h:hover .sl-knob,.sl.h.active .sl-knob{transform:scale(1.08)}
.ghost{position:absolute;left:-6px;right:-6px;height:0;border-top:2px dashed rgba(255,255,255,.55);opacity:0;transition:opacity .25s,bottom .12s}
.ghost.show{opacity:1}
.strip .sl.v{margin-top:14px}
.strip.is-muted .sl-fill{filter:saturate(.15) brightness(.55);box-shadow:none}
.val{font-size:30px;font-weight:300;letter-spacing:-.03em;margin-top:12px;font-variant-numeric:tabular-nums;line-height:1}
.val span{font-size:15px;color:var(--text3);margin-left:2px}
.mute-btn{margin-top:12px;width:100%;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.06);font-weight:600;font-size:13px;transition:all .22s var(--ease)}
.mute-btn svg{width:17px;height:17px}
.mute-btn:hover{background:rgba(255,255,255,.1)}
.mute-btn.on{background:var(--red);color:#fff;box-shadow:0 8px 24px rgba(255,69,58,.35)}
.strip .fnum{display:none}
.phys-note{position:absolute;bottom:118px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--text2);white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px}
.phys-note.show{opacity:1}
.others{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:16px;padding:14px 20px}
.orow{display:grid;grid-template-columns:30px 112px 1fr 44px 34px;align-items:center;gap:12px;height:40px}
.orow .chip-ico{width:30px;height:30px;border-radius:9px}
.orow .chip-ico svg{width:16px;height:16px}
.orow .nm{font-weight:550}
.orow .pct{color:var(--text2);text-align:right;font-variant-numeric:tabular-nums}
.ibtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--text2);transition:all .2s}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.ibtn.on{color:#fff;background:var(--red)}
/* popover */
.pop{position:fixed;z-index:50;min-width:220px;padding:8px;border-radius:16px;background:rgba(36,36,40,.92);backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--stroke2);box-shadow:0 24px 60px rgba(0,0,0,.55);opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;transition:opacity .16s,transform .16s var(--ease);pointer-events:none}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:330px}
.pop .tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:12px;font-size:12px;font-weight:550;position:relative}
.pop .tile:hover{background:rgba(255,255,255,.07)}
.pop .tile.cur{background:rgba(255,255,255,.1)}
.pop .tile .chip-ico{width:36px;height:36px}
.pop .tile em{position:absolute;top:6px;right:6px;font-style:normal;font-size:9.5px;color:var(--text3);font-weight:700}
.pop .ptitle{font-size:11.5px;font-weight:650;color:var(--text3);padding:6px 8px 8px;text-transform:uppercase;letter-spacing:.06em}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:10px;font-weight:500;text-align:left}
.menu-item svg{width:17px;height:17px;color:var(--text2)}
.menu-item:hover{background:var(--accent);color:#fff}
.menu-item:hover svg{color:#fff}
.menu-sep{height:1px;background:var(--stroke);margin:6px 8px}
.swatches{display:grid;grid-template-columns:repeat(6,30px);gap:9px;padding:6px}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);transition:transform .15s}
.sw:hover{transform:scale(1.12)}
.sw.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.sw-custom{display:flex;align-items:center;gap:10px;padding:8px 6px 4px;color:var(--text2);font-size:12px}
.sw-custom input{width:34px;height:26px;border:0;background:none;padding:0;cursor:pointer}
/* micro */
.mic-grid{display:grid;grid-template-columns:400px 1fr;gap:18px;height:100%}
.meter{display:flex;gap:3px;height:46px;align-items:stretch;margin:4px 0 6px}
.meter i{flex:1;border-radius:3px;background:rgba(255,255,255,.07);transition:background .06s}
.meter-db{display:flex;justify-content:space-between;color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums}
.meter-db b{color:var(--text);font-size:22px;font-weight:300;letter-spacing:-.02em}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(255,255,255,.06);gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--text2);transition:all .2s var(--ease);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.field{margin-top:16px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-weight:550}
.field-top span{color:var(--text2);font-variant-numeric:tabular-nums;font-weight:500}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row .pill{flex:1;justify-content:center;height:40px;border-radius:13px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.preset{position:relative;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--stroke);transition:all .22s var(--ease)}
.preset:hover{background:rgba(255,255,255,.065)}
.preset.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.preset .chip-ico{width:32px;height:32px;margin-bottom:10px}
.preset b{display:block;font-size:13.5px;font-weight:650}
.preset p{color:var(--text2);font-size:11.5px;line-height:1.4;margin-top:3px}
.tag{position:absolute;top:12px;right:12px;font-size:10px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(48,209,88,.18);color:#4cdc77;letter-spacing:.02em}
.tabs{display:flex;gap:4px;margin-bottom:14px}
.tabs button{padding:7px 13px;border-radius:10px;color:var(--text2);font-weight:600;font-size:12.5px}
.tabs button.on{background:rgba(255,255,255,.1);color:var(--text)}
.eq{position:relative;height:200px}
.eq canvas{position:absolute;inset:0;width:100%;height:100%}
.eq-bands{position:relative;display:grid;grid-template-columns:repeat(6,1fr);height:100%;z-index:1}
.eq-band{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.eq-band .sl.v .sl-track{width:6px;height:150px;border-radius:3px;overflow:visible;background:rgba(255,255,255,.1)}
.eq-band .sl.v .sl-fill{display:none}
.eq-band .sl.v .sl-knob{display:block;position:absolute;left:50%;width:22px;height:22px;margin:0 0 -11px -11px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.5);transition:bottom .14s var(--ease)}
.eq-band small{color:var(--text3);font-size:11px}
.eq-band b{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.switch{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.16);position:relative;transition:background .22s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s var(--ease)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}
.row-switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0}
.row-switch b{font-weight:600;display:block}
.row-switch small{color:var(--text2);font-size:11.5px;display:block;margin-top:2px;line-height:1.35}
/* routage */
.route-grid{display:grid;grid-template-columns:1fr 330px;gap:18px;height:100%}
table.mx{width:100%;border-collapse:separate;border-spacing:0}
.mx th{padding:0 4px 12px;font-weight:600;font-size:11.5px;color:var(--text2);text-align:center;vertical-align:bottom}
.mx th .chip-ico{margin:0 auto 7px;width:32px;height:32px;--c:#8e8e93}
.mx th:first-child{text-align:left}
.mx td{padding:9px 4px;text-align:center;border-top:1px solid var(--stroke)}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--stroke);color:var(--text2);font-size:11.5px}
.legend b{color:var(--text);font-weight:600;margin-right:4px}
.hint-card{display:flex;gap:12px;align-items:flex-start}
.hint-card p{color:var(--text2);font-size:12px;line-height:1.5}
.hint-card b{color:var(--text)}
.mx td:first-child{text-align:left}
.mx .rname{display:flex;align-items:center;gap:11px;font-weight:600}
.mx .rname .chip-ico{width:30px;height:30px;border-radius:9px}
.mx .rname .chip-ico svg{width:16px;height:16px}
.node{width:30px;height:30px;border-radius:50%;margin:auto;display:grid;place-items:center;border:2px solid rgba(255,255,255,.14);transition:all .22s var(--ease)}
.node svg{width:15px;height:15px;opacity:0;transform:scale(.4);transition:all .22s var(--ease);color:#fff}
.node:hover{border-color:rgba(255,255,255,.35)}
.node.on{background:var(--c);border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.node.on svg{opacity:1;transform:none}
/* eclairage */
.light-grid{display:grid;grid-template-columns:470px 1fr;gap:18px;height:100%}
.device{display:grid;place-items:center;padding:10px 0 4px}
.device svg{width:100%;height:auto}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.theme{padding:10px;border-radius:14px;border:1px solid var(--stroke);background:rgba(255,255,255,.03);text-align:left;transition:all .2s}
.theme:hover{background:rgba(255,255,255,.06)}
.theme.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.theme .bars{display:flex;gap:4px;height:34px;margin-bottom:8px}
.theme .bars i{flex:1;border-radius:6px}
.theme b{font-size:12px;font-weight:600}
.custom-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.custom-row .lbl{flex:1;font-weight:550}
.custom-row .sws{display:flex;gap:8px}
.swb{width:30px;height:30px;border-radius:9px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .15s}
.swb:hover{transform:scale(1.08)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 13px;border-radius:11px;background:rgba(255,255,255,.055);font-weight:600;font-size:12px;color:var(--text2);transition:all .2s}
.chips button.on{background:var(--text);color:#000}
/* scenes */
.scene-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;height:100%}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scene{position:relative;text-align:left;padding:16px;border-radius:20px;border:1px solid var(--stroke);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));transition:all .25s var(--ease);min-height:168px;display:flex;flex-direction:column}
.scene:hover{transform:translateY(-2px);border-color:var(--stroke2)}
.scene.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 40px color-mix(in srgb,var(--accent) 22%,transparent)}
.scene .chip-ico{width:38px;height:38px;border-radius:12px;margin-bottom:12px}
.scene b{font-size:14.5px;font-weight:650}
.scene p{color:var(--text2);font-size:11.5px;line-height:1.4;margin-top:4px;flex:1}
.scene .lane{display:flex;gap:6px;margin-top:12px}
.scene .lane span{flex:1;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.scene .lane svg{width:15px;height:15px}
.scene .tag{background:color-mix(in srgb,var(--accent) 25%,transparent);color:#7cc0ff}
.mine{margin-top:16px}
.mine-list{display:flex;flex-direction:column;gap:6px;max-height:120px;overflow:auto}
.mine-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.04)}
.mine-item b{flex:1;font-weight:600}
.save-row{display:flex;gap:8px;margin-top:10px}
.save-row input{flex:1;height:36px;border-radius:11px;border:1px solid var(--stroke2);background:rgba(0,0,0,.25);padding:0 12px;outline:none;user-select:text}
.save-row input:focus{border-color:var(--accent)}
.advice{display:flex;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);margin-bottom:8px}
.advice .chip-ico{width:30px;height:30px;border-radius:9px}
.advice .chip-ico svg{width:16px;height:16px}
.advice b{display:block;font-weight:600;font-size:12.5px}
.advice p{color:var(--text2);font-size:11.5px;line-height:1.4;margin-top:2px}
.advice .pill{height:28px;margin-top:8px;padding:0 11px;font-size:11.5px}
/* menu bas droite, toast, feuille */
#fab{position:fixed;right:22px;bottom:20px;z-index:40;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(44,44,48,.85);backdrop-filter:blur(20px);border:1px solid var(--stroke2);box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .2s var(--ease),background .2s}
#fab:hover{transform:scale(1.06);background:rgba(60,60,66,.9)}
#fab svg{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:12px;padding:11px 12px 11px 18px;border-radius:16px;background:rgba(44,44,48,.92);backdrop-filter:blur(24px);border:1px solid var(--stroke2);box-shadow:0 16px 40px rgba(0,0,0,.5);font-weight:550;transition:all .3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:650;padding:4px 8px;border-radius:8px}
#toast button:hover{background:rgba(10,132,255,.15)}
#sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.on{opacity:1;pointer-events:auto}
.sheet-box{width:440px;padding:28px;border-radius:26px;background:rgba(32,32,36,.96);border:1px solid var(--stroke2);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;transform:scale(.95);transition:transform .3s var(--ease)}
#sheet.on .sheet-box{transform:none}
.sheet-box h2{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:16px}
.sheet-box p{color:var(--text2);margin-top:6px;line-height:1.5}
.ring{width:96px;height:96px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring .ico svg{width:34px;height:34px;transform:none}
.sheet-actions{display:flex;gap:10px;justify-content:center;margin-top:22px}
.sheet-actions .pill{height:40px;padding:0 20px;border-radius:13px}
.sheet-meter{margin-top:16px}
#offline{position:absolute;left:34px;right:34px;top:86px;z-index:30;display:none;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:#ff8a82;font-weight:550}
#offline.on{display:flex}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
/* v4 */
.mute-btn.part{background:var(--orange);color:#1a1000;box-shadow:0 8px 24px rgba(255,159,10,.3)}
.strip-head .nm{min-width:0;flex:1}
.strip-head .nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strips{grid-template-columns:repeat(4,minmax(0,1fr))}
.strip.is-part{border-color:rgba(255,159,10,.32)}
.ibtn.part{color:#1a1000;background:var(--orange)}
.pill.warn{background:rgba(255,159,10,.16);border-color:rgba(255,159,10,.4);color:#ffb340}
.node.auto{border-style:dashed;cursor:help;opacity:.8}
.mode-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 6px;max-width:330px}
.mode-chips button{padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.06);font-weight:600;font-size:12px;color:var(--text2)}
.mode-chips button:hover{background:rgba(255,255,255,.1)}
.mode-chips button.on{background:var(--text);color:#000}
.pop .hint{color:var(--text3);font-size:11px;padding:0 8px 6px;max-width:330px;line-height:1.4}
#offline .pill{margin-left:auto;height:28px;padding:0 12px;color:var(--text)}
#offline.warn{background:rgba(255,159,10,.12);border-color:rgba(255,159,10,.32);color:#ffbd5c}
#offline.info{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.32);color:#7cc0ff}
.sim-badge{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:7px;background:rgba(191,90,242,.18);color:#d48cff;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.meter-db .clip{color:var(--red);font-weight:700;font-size:11px;margin-left:8px;opacity:0;transition:opacity .2s}
.meter-db .clip.on{opacity:1}
.sheet-box.wide{width:660px;text-align:left}
.sheet-box.wide h2{margin-top:0}
.sheet-box.wide .sheet-actions{justify-content:flex-end}
.diag-head{display:flex;align-items:center;gap:12px}
.diag-head .chip-ico{width:40px;height:40px;border-radius:12px}
.diag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.diag-grid div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.diag-grid b{display:block;font-size:16px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diag-grid small{color:var(--text3);font-size:11px}
.diag-log{margin-top:12px;height:150px;overflow:auto;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.35);font:11px/1.55 ui-monospace,Consolas,monospace;color:var(--text2);white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.diag-sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--stroke)}
.diag-sim .pill{height:30px;padding:0 11px;font-size:11.5px}
.auto-list{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px;max-height:118px;overflow:auto}
.auto-item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:11px;background:rgba(255,255,255,.04);font-weight:550;font-size:12.5px}
.auto-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auto-item em{font-style:normal;color:var(--text3);margin:0 4px}
.auto-add{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px}
.inp{height:34px;border-radius:10px;border:1px solid var(--stroke2);background:rgba(0,0,0,.25);color:var(--text);padding:0 10px;outline:none;font:inherit;min-width:0;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--accent)}
select.inp option{background:#1c1c20}
.auto-note{color:var(--text3);font-size:11.5px;margin-top:8px;line-height:1.4}
.url-box{margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(0,0,0,.35);font:12.5px ui-monospace,Consolas,monospace;user-select:text;-webkit-user-select:text;word-break:break-all}
/* mises a jour */
.ver-row{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--stroke);font-size:11.5px;color:var(--text2);white-space:nowrap}
.ver-row b{color:var(--text);font-weight:600}
.ver-state{display:inline-flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis}
.ver-state i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.ver-state.avail{color:#7cc0ff;cursor:pointer}
.ver-state.avail i{background:var(--accent)}
.ver-state.busy i{background:var(--orange)}
.ver-row .ibtn{width:24px;height:24px;margin-left:auto;border-radius:7px}
.ver-row .ibtn svg{width:14px;height:14px}
.ver-row .ibtn.spin-on svg{animation:sp .9s linear infinite}
.upd-btn{width:100%;justify-content:center;margin-top:8px;height:30px}
.notes{margin-top:14px;max-height:270px;overflow:auto;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.28);color:var(--text2);font-size:12.5px;line-height:1.55;user-select:text;-webkit-user-select:text}
.notes h4{color:var(--text);font-size:13px;margin:10px 0 4px}
.notes h4:first-child{margin-top:0}
.notes ul,.notes ol{padding-left:18px;margin:4px 0}
.notes p{margin:4px 0}
.notes code{font:11.5px ui-monospace,Consolas,monospace;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.notes pre{background:rgba(0,0,0,.35);padding:8px 10px;border-radius:8px;overflow:auto}
.notes a{color:#7cc0ff}
.upd-progress{margin-top:16px}
.upd-progress .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.upd-progress .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.upd-progress .bar.indet i{width:30%!important;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.upd-progress small{display:block;margin-top:8px;color:var(--text2);font-size:12px}
.upd-fail{margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:#ff8a82;font-size:12.5px}
.upd-why{margin-top:14px;padding:11px 14px;border-radius:12px;background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.28);color:#ffbd5c;font-size:12.5px}
</style>
</head>

  <aside>

      <button data-p="mic" data-i="Mic">Micro</button>
      <button data-p="routing" data-i="routing">Routage</button>
      <button data-p="light" data-i="light">Éclairage</button>

    <div class="side-foot"><div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">Connexion…</span></div><small id="conn-fw"></small><div class="ver-row"><b id="ver-txt">GoXLR Mini</b><span class="ver-state" id="ver-state"></span><button class="ibtn" id="ver-check" title="Rechercher une mise à jour"></button></div><button class="pill primary upd-btn" id="upd-btn" style="display:none">Mettre à jour</button></div>
  </aside>
  <main>
    <header>
      <div><h1 id="h-title">Mixeur</h1><p id="h-sub"></p></div>
      <div class="hdr-actions"><button class="pill" id="hdr-mic">Micro</button></div>
    </header>
    <div id="offline"><span class="spin"></span><span id="offline-txt"></span><button class="pill" id="offline-diag">Diagnostic</button></div>
    <section class="page" id="p-mixer"></section>
    <section class="page" id="p-mic"></section>
    <section class="page" id="p-routing"></section>
    <section class="page" id="p-light"></section>
    <section class="page" id="p-scenes"></section>
  </main>
</div>
<button id="fab" title="Menu"></button>
<div id="toast"></div>
<div id="sheet"><div class="sheet-box" id="sheet-box"></div></div>

function mdInline(t) {

    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>")

}
function mdRender(src) {
  var out = [], list = null, code = null;
  function close() { if (list) { out.push("</" + list + ">"); list = null; } }
  String(src || "").replace(/\r/g, "").split("\n").forEach(function (line) {
    if (/^```/.test(line)) { if (code === null) { close(); code = []; } else { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; } return; }
    if (code !== null) { code.push(line); return; }
    var m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push("<h4>" + mdInline(m[1]) + "</h4>"); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(m[1]) + "</li>"); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + mdInline(m[1]) + "</li>"); }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); out.push("<p><i>" + mdInline(m[1]) + "</i></p>"); }
    else if (line.trim()) { close(); out.push("<p>" + mdInline(line) + "</p>"); }
    else close();
  });

    if (target > -3) clipT = t;
    if (page === "mic" && built.mic) {
      meterPaint(document.querySelector("#p-mic .meter"), meterShown);
      var dbt = meterShown <= -72 ? "—" : Math.round(meterShown) + " dB";
      if ($("mic-db").textContent !== dbt) $("mic-db").textContent = dbt;
      $("mic-clip").classList.toggle("on", t - clipT < 1500);
    }
    var sm = $("sheet-meter"); if (sm) meterPaint(sm, meterShown);
    if (liveChanged) {
      if (page === "mixer") liveMixer();
      if (page === "light" && built.light && t - lastDev > 100) { lt.dev.innerHTML = deviceSvg(); lastDev = t; liveChanged = false; }
      if (page !== "light") liveChanged = false;
    }
    liveJob();
  }
  requestAnimationFrame(frame);
}
function init() {
  document.querySelectorAll("nav button").forEach(function (b) {
    b.insertAdjacentHTML("afterbegin", svg(b.dataset.i));
    b.addEventListener("click", function () { go(b.dataset.p); });
  });
  $("fab").innerHTML = svg("more");
  $("fab").addEventListener("click", function () { if (popEl) closePop(); else openMenu(); });
  $("hdr-mic").addEventListener("click", function () { if (!S) return; toggleMute("Mic", "all"); });
  $("offline-diag").addEventListener("click", openDiag);
  $("ver-check").innerHTML = svg("refresh");
  $("ver-check").addEventListener("click", checkUpdate);
  $("upd-btn").addEventListener("click", openUpdateSheet);
  $("ver-state").addEventListener("click", function () { if (S && S.update && S.update.status === "available") openUpdateSheet(); });
  $("import-file").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) { var p = JSON.parse(t); return withUndo("Configuration importée", function () { return post("profile", p).then(refresh); }); })
      .catch(function () { toast("Fichier illisible"); });
    e.target.value = "";
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePop(); if (sheetState && !sheetState.job) closeSheet(); } });
  document.addEventListener("contextmenu", function (e) { if (e.target.tagName !== "INPUT") e.preventDefault(); });
  refresh().then(function () { go(location.hash.slice(1) || "mixer"); });
  liveLoop();
  requestAnimationFrame(frame);
}
init();
</script>
