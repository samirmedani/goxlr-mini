  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#f5f5f7; --text:#1d1d1f; --text2:#6e6e73; --text3:#8e8e93;
  --accent:#0071e3; --accent-soft:rgba(0,113,227,.1);
  --red:#ff3b30; --green:#34c759; --yellow:#ffcc00; --orange:#ff9500; --orange-text:#c66a00;
  --hair:rgba(0,0,0,.07); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07);
  --stroke:var(--hair); --stroke2:rgba(0,0,0,.1);
  --shadow:0 1px 2px rgba(17,24,39,.04),0 10px 30px rgba(17,24,39,.06),0 30px 80px rgba(17,24,39,.05);
  --shadow-lift:0 2px 6px rgba(17,24,39,.06),0 18px 44px rgba(17,24,39,.1),0 40px 100px rgba(17,24,39,.08);
  --ease:cubic-bezier(.22,1,.36,1); --r:22px; --side:248px;
  --fh:clamp(150px,calc(100vh - 588px),330px);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:"Inter Variable","Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:inherit}
svg{display:block}
::selection{background:rgba(0,113,227,.18)}

/* fond ambiant */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 700px at 30% -10%,#fff 0%,rgba(255,255,255,0) 60%),var(--bg)}
.ambient span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 40s var(--ease) infinite alternate}
.ambient .a{width:55vw;height:55vw;left:-14vw;top:-22vw;background:radial-gradient(circle,#ffd9c4 0%,rgba(255,217,196,0) 68%)}
.ambient .b{width:48vw;height:48vw;right:-12vw;top:-14vw;background:radial-gradient(circle,#cfe4ff 0%,rgba(207,228,255,0) 68%);animation-duration:48s}
.ambient .c{width:42vw;height:42vw;left:28vw;bottom:-24vw;background:radial-gradient(circle,#e8dcff 0%,rgba(232,220,255,0) 68%);animation-duration:56s}
.ambient .d{width:32vw;height:32vw;right:4vw;bottom:-10vw;background:radial-gradient(circle,#d2f4e6 0%,rgba(210,244,230,0) 68%);animation-duration:62s}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(5vw,4vw,0) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.ambient span{animation:none}}

/* verre */
aside,.card,.pop,#toast,.sheet-box,.others{
  background:linear-gradient(160deg,rgba(255,255,255,.76),rgba(255,255,255,.5));
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px .5px rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.4),0 0 0 .5px rgba(0,0,0,.05),var(--shadow)}

/* structure */
#app{position:relative;z-index:1;display:grid;grid-template-columns:calc(var(--side) + 32px) minmax(0,1fr);height:100%}
aside{position:relative;margin:16px 16px 16px 16px;border-radius:24px;display:flex;flex-direction:column;padding:18px 12px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 0}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 10px rgba(17,24,39,.22))}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.15}
.brand small{color:var(--text3);font-size:12px}
nav{display:flex;flex-direction:column;gap:3px;margin-top:24px}
nav button{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:14px;font-weight:520;font-size:15px;color:var(--text);transition:background .25s var(--ease),color .25s;text-align:left}
nav button svg{width:20px;height:20px;color:var(--text2);flex:none;transition:color .25s}
nav button:hover:not(.on){background:rgba(255,255,255,.55)}
nav button.on{color:var(--accent);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(243,248,255,.92));box-shadow:0 1px 2px rgba(0,40,120,.08),0 8px 20px rgba(0,70,170,.08),inset 0 0 0 .5px rgba(0,113,227,.14)}
nav button.on svg{color:var(--accent)}
nav .badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:rgba(255,149,0,.16);color:var(--orange-text);font-size:12px;font-weight:650;display:grid;place-items:center;padding:0 6px}
.side-foot{margin-top:auto;padding:12px 10px 2px;border-top:.5px solid var(--hair)}
.conn{display:flex;align-items:center;gap:11px;font-weight:600;font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--red);box-shadow:0 0 0 3px rgba(255,59,48,.16)}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.side-foot small{display:block;color:var(--text3);font-size:12px;margin:2px 0 0 19px;line-height:1.5}
main{position:relative;min-width:0;overflow-y:auto;overflow-x:hidden;padding:22px 40px 28px 16px;scrollbar-gutter:stable}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 18px}
.eyebrow{font-size:12.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--text3)}
header h1{font-size:42px;line-height:1.06;font-weight:750;letter-spacing:-.032em;margin-top:5px}
header p{color:var(--text2);font-size:15px;margin-top:6px}
.hdr-actions{display:flex;gap:10px;align-items:center;padding-bottom:6px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);font-size:13.5px;font-weight:580;white-space:nowrap;transition:background .2s,box-shadow .2s,transform .15s var(--ease)}
.pill svg{width:16px;height:16px;flex:none}
.pill:hover{background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.07)}
.pill:active{transform:scale(.98)}
.pill.primary{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(0,60,140,.2),0 6px 16px rgba(0,113,227,.22)}
.pill.primary:hover{background:#0077ed}
.pill.danger{background:rgba(255,59,48,.12);color:#d70015;box-shadow:inset 0 0 0 .5px rgba(255,59,48,.25)}
.pill.warn{background:rgba(255,149,0,.14);color:var(--orange-text);box-shadow:inset 0 0 0 .5px rgba(255,149,0,.28)}
#hdr-mic{height:40px;padding:0 18px;font-size:14px;background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 .5px rgba(0,113,227,.16)}
#hdr-mic svg{width:18px;height:18px}
#hdr-mic.danger{background:rgba(255,59,48,.12);color:#d70015;box-shadow:inset 0 0 0 .5px rgba(255,59,48,.25)}
#hdr-mic.warn{background:rgba(255,149,0,.14);color:var(--orange-text);box-shadow:inset 0 0 0 .5px rgba(255,149,0,.28)}
.page{display:none}
.page.on{display:block;animation:pagein .35s var(--ease)}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{border-radius:var(--r);padding:20px}
.card h3{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 small{color:var(--text3);font-weight:500;margin-left:auto;font-size:12.5px;letter-spacing:0}
.muted-txt{color:var(--text2)}
.chip-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,color-mix(in srgb,var(--c) 12%,#fff),color-mix(in srgb,var(--c) 20%,#fff));color:color-mix(in srgb,var(--c) 82%,#000)}
.chip-ico svg{width:18px;height:18px}

/* curseurs */
.sl{position:relative;touch-action:none}
.sl-track{position:relative;cursor:pointer}
.sl-fill{position:absolute;left:0;bottom:0;background:var(--c);transition:height .14s var(--ease),width .14s var(--ease)}
.sl.active .sl-fill,.sl.active .sl-knob{transition:none}
.sl.v .sl-track{width:72px;height:var(--fh);border-radius:999px;overflow:hidden;background:linear-gradient(180deg,#e6e6eb,#efeff3);box-shadow:inset 0 1px 2px rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.04)}
.sl.v .sl-fill{width:100%;border-radius:22px 22px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 88%,#000))}
.sl.v .sl-fill::after{content:"";position:absolute;left:24px;right:24px;top:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.92)}
.sl.v .sl-knob{display:none}
.sl.h{padding:9px 0}
.sl.h .sl-track{height:6px;border-radius:3px;background:rgba(118,118,128,.16)}
.sl.h .sl-fill{top:0;height:100%;border-radius:3px}
.sl.h .sl-knob{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.08);transition:left .14s var(--ease),transform .15s var(--ease)}
.sl.h:hover .sl-knob,.sl.h.active .sl-knob{transform:scale(1.08)}

/* mixeur */
.strips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:2px 0 6px}
.strip{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.strip-head{display:flex;align-items:center;gap:9px;max-width:100%;padding:6px 10px;border-radius:12px;transition:background .2s}
.strip-head:hover{background:rgba(255,255,255,.6)}
.strip-head .chip-ico{width:auto;height:auto;background:none}
.strip-head .chip-ico svg{width:22px;height:22px}
.strip-head .nm{font-weight:650;font-size:16.5px;letter-spacing:-.01em;text-align:left;line-height:1.15;min-width:0}
.strip-head .nm small{display:block;color:var(--text3);font-size:12px;font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip-head .chev{width:14px;height:14px;color:var(--text3);opacity:0;transition:opacity .2s;flex:none}
.strip-head:hover .chev{opacity:1}
.strip .sl.v{margin-top:10px}
.strip.is-muted .sl-fill{filter:saturate(.12) brightness(1.05);opacity:.55}
.ghost{position:absolute;left:-4px;right:-4px;height:0;border-top:2px dashed rgba(29,29,31,.5);opacity:0;transition:opacity .25s,bottom .12s}
.ghost.show{opacity:1}
.val{font-size:42px;font-weight:300;letter-spacing:-.035em;margin-top:10px;font-variant-numeric:tabular-nums;line-height:1}
.val span{font-size:19px;color:var(--text3);margin-left:3px;letter-spacing:0}
.mute-btn{margin-top:12px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(118,118,128,.12);color:#3a3a3c;transition:background .22s var(--ease),color .22s,box-shadow .22s,transform .15s var(--ease)}
.mute-btn svg{width:21px;height:21px}
.mute-btn:hover{background:rgba(118,118,128,.2)}
.mute-btn:active{transform:scale(.94)}
.mute-btn.on{background:var(--red);color:#fff;box-shadow:0 6px 18px rgba(255,59,48,.32)}
.mute-btn.part{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(255,149,0,.32)}
.mute-cap{margin-top:6px;font-size:13px;font-weight:500;color:var(--text2);text-align:center;white-space:nowrap}
.mute-cap.on{color:#d70015;font-weight:600}
.mute-cap.part{color:var(--orange-text);font-weight:600}
.strip .fnum{display:none}
.phys-note{position:absolute;top:calc(var(--fh) + 30px);left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:550;color:#fff;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;background:rgba(29,29,31,.78);padding:4px 9px;border-radius:9px}
.phys-note.show{opacity:1}
.others{display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin-top:18px;padding:2px 22px;border-radius:20px}
.orow{display:grid;grid-template-columns:28px minmax(96px,128px) minmax(0,1fr) 48px 34px;align-items:center;gap:12px;height:48px;border-bottom:.5px solid var(--hair)}
.orow:nth-last-child(-n+2){border-bottom:0}
.orow .chip-ico{width:28px;height:28px;background:none}
.orow .chip-ico svg{width:20px;height:20px}
.orow .nm{font-weight:550;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .pct{color:var(--text2);text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.ibtn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--text2);transition:background .2s,color .2s}
.ibtn svg{width:18px;height:18px}
.ibtn:hover{background:rgba(118,118,128,.12);color:var(--text)}
.ibtn.on{color:#fff;background:var(--red)}
.ibtn.part{color:#fff;background:var(--orange)}

/* popover et menu */
.pop{position:fixed;z-index:50;min-width:220px;padding:8px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.9));-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),var(--shadow-lift);opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;transition:opacity .16s,transform .2s var(--ease);pointer-events:none}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:336px}
.pop .tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:12px;font-size:12.5px;font-weight:560;position:relative}
.pop .tile:hover{background:rgba(118,118,128,.1)}
.pop .tile.cur{background:var(--accent-soft);color:var(--accent)}
.pop .tile .chip-ico{width:38px;height:38px;border-radius:12px}
.pop .tile em{position:absolute;top:6px;right:7px;font-style:normal;font-size:10px;color:var(--text3);font-weight:700}
.pop .ptitle{font-size:11.5px;font-weight:650;color:var(--text3);padding:6px 8px 8px;text-transform:uppercase;letter-spacing:.05em}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;height:36px;padding:0 11px;border-radius:9px;font-weight:500;font-size:14px;text-align:left}
.menu-item svg{width:17px;height:17px;color:var(--text2)}
.menu-item:hover{background:var(--accent);color:#fff}
.menu-item:hover svg{color:#fff}
.menu-sep{height:.5px;background:var(--stroke2);margin:5px 10px}
.swatches{display:grid;grid-template-columns:repeat(6,30px);gap:10px;padding:8px}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);transition:transform .15s var(--ease)}
.sw:hover{transform:scale(1.12)}
.sw.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.sw-custom{display:flex;align-items:center;gap:10px;padding:8px 8px 4px;color:var(--text2);font-size:12.5px}
.sw-custom input{width:34px;height:26px;border:0;background:none;padding:0;cursor:pointer}
.mode-chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 6px;max-width:336px}
.mode-chips button,.chips button{height:32px;padding:0 13px;border-radius:999px;background:rgba(118,118,128,.1);font-weight:580;font-size:13px;color:var(--text);transition:background .2s,color .2s}
.mode-chips button:hover,.chips button:hover{background:rgba(118,118,128,.18)}
.mode-chips button.on,.chips button.on{background:var(--text);color:#fff}
.pop .hint{color:var(--text3);font-size:12px;padding:2px 8px 6px;max-width:336px;line-height:1.45}

/* micro */
.mic-grid{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:18px;align-items:start}
.meter{display:flex;gap:3px;height:42px;align-items:stretch;margin:2px 0 8px}
.meter i{flex:1;border-radius:3px;background:rgba(0,0,0,.07);transition:background .06s}
.meter-db{display:flex;justify-content:space-between;align-items:baseline;color:var(--text3);font-size:12px;font-variant-numeric:tabular-nums}
.meter-db b{color:var(--text);font-size:26px;font-weight:300;letter-spacing:-.03em}
.meter-db .clip{color:var(--red);font-weight:700;font-size:11.5px;margin-left:8px;opacity:0;transition:opacity .2s}
.meter-db .clip.on{opacity:1}
.seg,.tabs{display:flex;padding:2px;border-radius:10px;background:rgba(118,118,128,.12);gap:0}
.seg button,.tabs button{flex:1;height:30px;padding:0 10px;border-radius:8px;font-weight:560;font-size:13px;color:var(--text);transition:background .2s var(--ease),box-shadow .2s;white-space:nowrap}
.seg button.on,.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.tabs{display:inline-flex;margin-bottom:16px}
.tabs button{flex:none;padding:0 14px}
.field{margin-top:16px}
.field-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-weight:560}
.field-top span{color:var(--text2);font-variant-numeric:tabular-nums;font-weight:500}
.btn-row{display:flex;gap:10px;margin-top:18px}
.btn-row .pill{flex:1;height:40px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.preset{position:relative;text-align:left;padding:14px;border-radius:16px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.03);transition:background .2s,box-shadow .2s,transform .2s var(--ease)}
.preset:hover{background:#fff;transform:translateY(-1px);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),0 8px 22px rgba(17,24,39,.08)}
.preset.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent),0 8px 22px rgba(0,113,227,.12)}
.preset .chip-ico{width:34px;height:34px;margin-bottom:10px}
.preset b{display:block;font-size:14px;font-weight:650}
.preset p{color:var(--text2);font-size:12.5px;line-height:1.4;margin-top:3px}
.tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;height:20px;display:inline-flex;align-items:center;padding:0 8px;border-radius:999px;background:rgba(52,199,89,.14);color:#1e7e34;letter-spacing:.03em}
.eq{position:relative;height:210px}
.eq canvas{position:absolute;inset:0;width:100%;height:100%}
.eq-bands{position:relative;display:grid;grid-template-columns:repeat(6,1fr);height:100%;z-index:1}
.eq-band{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.eq-band .sl.v .sl-track{width:6px;height:150px;border-radius:3px;overflow:visible;background:rgba(118,118,128,.16);box-shadow:none}
.eq-band .sl.v .sl-fill{display:none}
.eq-band .sl.v .sl-knob{display:block;position:absolute;left:50%;width:22px;height:22px;margin:0 0 -11px -11px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.06),0 4px 10px rgba(0,0,0,.08);transition:bottom .14s var(--ease)}
.eq-band small{color:var(--text3);font-size:11.5px}
.eq-band b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.switch{width:46px;height:28px;border-radius:14px;background:rgba(120,120,128,.18);position:relative;transition:background .25s var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04);transition:transform .3s var(--ease)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}
.row-switch{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0}
.row-switch + .row-switch{border-top:.5px solid var(--hair)}
.row-switch b{font-weight:600;font-size:14px;display:block}
.row-switch small{color:var(--text2);font-size:12.5px;display:block;margin-top:2px;line-height:1.4}

/* routage */
.route-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
table.mx{width:100%;border-collapse:separate;border-spacing:0}
.mx th{padding:0 4px 12px;font-weight:600;font-size:12.5px;color:var(--text2);text-align:center;vertical-align:bottom}
.mx th .chip-ico{margin:0 auto 8px;width:34px;height:34px;--c:#8e8e93}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx td{padding:8px 4px;text-align:center;border-top:.5px solid var(--hair)}
.mx .rname{display:flex;align-items:center;gap:11px;font-weight:600;font-size:14px}
.mx .rname .chip-ico{width:30px;height:30px;border-radius:9px}
.mx .rname .chip-ico svg{width:16px;height:16px}
.node{width:30px;height:30px;border-radius:50%;margin:auto;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.14);transition:background .22s var(--ease),box-shadow .22s,transform .15s var(--ease)}
.node svg{width:15px;height:15px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s var(--ease);color:#fff}
.node:hover{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.28)}
.node:active{transform:scale(.92)}
.node.on{background:var(--c);box-shadow:0 3px 10px color-mix(in srgb,var(--c) 38%,transparent)}
.node.on svg{opacity:1;transform:none}
.node.auto{cursor:help;opacity:.7;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.16);background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.35) 3px 6px)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px;margin-top:18px;padding-top:16px;border-top:.5px solid var(--hair);color:var(--text2);font-size:12.5px}
.legend b{color:var(--text);font-weight:600;margin-right:5px}
.hint-card{display:flex;gap:12px;align-items:flex-start}
.hint-card p{color:var(--text2);font-size:12.5px;line-height:1.5}
.hint-card b{color:var(--text)}

/* eclairage */
.light-grid{display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);gap:18px;align-items:start}
.device{display:grid;place-items:center;padding:18px 16px 10px}
.device svg{width:100%;height:auto}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.theme{padding:10px;border-radius:14px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.07);text-align:left;transition:background .2s,box-shadow .2s,transform .2s var(--ease)}
.theme:hover{background:#fff;transform:translateY(-1px)}
.theme.on{background:#fff;box-shadow:inset 0 0 0 1.5px var(--accent),0 8px 20px rgba(0,113,227,.1)}
.theme .bars{display:flex;gap:4px;height:34px;margin-bottom:8px}
.theme .bars i{flex:1;border-radius:6px}
.theme b{font-size:13px;font-weight:600}
.custom-row{display:flex;align-items:center;gap:12px;height:50px}
.custom-row + .custom-row{border-top:.5px solid var(--hair)}
.custom-row .lbl{flex:1;font-weight:550}
.custom-row .sws{display:flex;gap:8px}
.swb{width:30px;height:30px;border-radius:9px;background:var(--c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);transition:transform .15s var(--ease)}
.swb:hover{transform:scale(1.08)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* scenes */
.scene-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.scene{position:relative;text-align:left;padding:16px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.76),rgba(255,255,255,.5));box-shadow:inset 0 1px .5px rgba(255,255,255,.95),0 0 0 .5px rgba(0,0,0,.05),var(--shadow);transition:transform .25s var(--ease),box-shadow .25s;min-height:172px;display:flex;flex-direction:column}
.scene:hover{transform:translateY(-2px);box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.06),var(--shadow-lift)}
.scene.on{box-shadow:inset 0 0 0 2px var(--accent),0 14px 36px rgba(0,113,227,.16)}
.scene .chip-ico{width:40px;height:40px;border-radius:12px;margin-bottom:12px}
.scene b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.scene p{color:var(--text2);font-size:12.5px;line-height:1.4;margin-top:4px;flex:1}
.scene .lane{display:flex;gap:6px;margin-top:12px}
.scene .lane span{flex:1;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 82%,#000)}
.scene .lane svg{width:15px;height:15px}
.scene .tag{background:var(--accent-soft);color:#0058b0}
.mine{margin-top:16px}
.mine-list{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto}
.mine-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:rgba(118,118,128,.07)}
.mine-item b{flex:1;font-weight:600}
.save-row{display:flex;gap:8px;margin-top:12px}
.save-row input,.inp{height:36px;border-radius:10px;border:0;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);padding:0 12px;outline:none;min-width:0;user-select:text;-webkit-user-select:text;transition:box-shadow .2s}
.save-row input{flex:1}
.save-row input:focus,.inp:focus{box-shadow:inset 0 0 0 1px var(--accent),0 0 0 3px rgba(0,113,227,.18)}
select.inp option{background:#fff;color:var(--text)}
.advice{display:flex;gap:12px;padding:12px;border-radius:14px;background:rgba(118,118,128,.07);margin-bottom:8px}
.advice .chip-ico{width:32px;height:32px;border-radius:10px}
.advice .chip-ico svg{width:17px;height:17px}
.advice b{display:block;font-weight:600;font-size:13.5px}
.advice p{color:var(--text2);font-size:12.5px;line-height:1.4;margin-top:2px}
.advice .pill{height:30px;margin-top:9px;padding:0 12px;font-size:12.5px}
.auto-list{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px;max-height:126px;overflow:auto}
.auto-item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:11px;background:rgba(118,118,128,.07);font-weight:560;font-size:13px}
.auto-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.auto-item em{font-style:normal;color:var(--text3);margin:0 4px}
.auto-add{display:grid;grid-template-columns:1fr 1fr 36px;gap:6px}
.auto-note{color:var(--text3);font-size:12px;margin-top:8px;line-height:1.4}
.url-box{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(118,118,128,.08);font:13px ui-monospace,"Cascadia Mono",Consolas,monospace;user-select:text;-webkit-user-select:text;word-break:break-all}

/* menu flottant, notification, feuille */
#fab{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);transition:transform .2s var(--ease)}
#fab{background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05)}
#fab:hover{background:#fff;transform:scale(1.05)}
#fab svg{width:20px;height:20px}
#toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:16px;background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,255,255,.84));box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),var(--shadow-lift);font-weight:560;transition:opacity .3s var(--ease),transform .35s var(--ease);pointer-events:none;max-width:min(640px,90vw)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent);font-weight:650;padding:6px 10px;border-radius:9px}
#toast button:hover{background:var(--accent-soft)}
#sheet{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(17,24,39,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.on{opacity:1;pointer-events:auto}
.sheet-box{width:440px;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);overflow:auto;padding:28px;border-radius:26px;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(255,255,255,.88));box-shadow:inset 0 1px .5px #fff,0 0 0 .5px rgba(0,0,0,.08),var(--shadow-lift);text-align:center;transform:scale(.96) translateY(6px);transition:transform .35s var(--ease)}
#sheet.on .sheet-box{transform:none}
.sheet-box h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:16px}
.sheet-box p{color:var(--text2);margin-top:6px;line-height:1.5}
.ring{width:96px;height:96px;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring .ico svg{width:34px;height:34px;transform:none}
.sheet-actions{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.sheet-actions .pill{height:40px;padding:0 20px;font-size:14px}
.sheet-meter{margin-top:16px}
.sheet-box.wide{width:680px;text-align:left}
.sheet-box.wide h2{margin-top:0}
.sheet-box.wide .sheet-actions{justify-content:flex-end}
/* assistant « Régler ma voix » */
.vs-steps{display:flex;justify-content:center;gap:6px;margin-bottom:20px}
.vs-steps span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 5px;border-radius:999px;background:rgba(118,118,128,.08);color:var(--text3);font-size:12.5px;font-weight:600;transition:background .25s,color .25s}
.vs-steps i{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:rgba(118,118,128,.16);color:var(--text2);font-style:normal;font-size:11px;font-weight:700;transition:background .25s,color .25s}
.vs-steps i svg{width:12px;height:12px;stroke-width:3}
.vs-steps span.on{background:var(--accent-soft);color:#0058b0}
.vs-steps span.on i{background:var(--accent);color:#fff}
.vs-steps span.done{color:var(--text2)}
.vs-steps span.done i{background:var(--green);color:#fff}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text)}
.ring .num b{font-size:34px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .num small{font-size:15px;font-weight:400;margin-left:2px;color:var(--text3);letter-spacing:0}
.ring.soft{width:84px;height:84px;border-radius:50%;background:var(--accent-soft)}
.ring.soft .ico svg{width:36px;height:36px}
.vs-read{display:none;margin-top:16px;padding:14px 16px;border-radius:14px;background:rgba(118,118,128,.07);color:var(--text);font-size:15px;line-height:1.55;text-align:left}
.vs-read.on{display:block}
.vs-status{margin-top:10px;min-height:18px;color:var(--text3);font-size:12.5px}
.vs-tips{display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:left}
.vs-tips div{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(118,118,128,.07);font-size:13.5px;line-height:1.4}
.vs-tips svg{width:18px;height:18px;flex:none;color:var(--accent)}
.diag-grid.vs-grid{grid-template-columns:repeat(3,1fr)}
.vs-grid em{display:block;margin-top:1px;color:var(--text3);font-size:11.5px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs-notes{margin-top:14px}
.vs-notes .advice{align-items:flex-start;margin-bottom:6px}
.vs-notes .advice p{margin-top:6px;color:var(--text);font-size:13.5px}
.vs-notes .advice .pill[disabled]{opacity:.6;pointer-events:none}
.cal-line{display:flex;align-items:flex-start;gap:8px;margin-top:14px;color:var(--text2);font-size:12.5px;line-height:1.45}
.cal-line svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.cal-line.ok svg{color:var(--green)}
.pill.listen-btn.on{background:var(--accent-soft);color:#0058b0;box-shadow:inset 0 0 0 .5px rgba(0,113,227,.25)}
#offline{display:none;align-items:center;gap:12px;margin:-6px 0 20px;padding:12px 14px 12px 16px;border-radius:16px;background:rgba(255,59,48,.08);box-shadow:inset 0 0 0 .5px rgba(255,59,48,.22);color:#c4000f;font-weight:560}
#offline.on{display:flex}
#offline .pill{margin-left:auto;height:30px;padding:0 12px;color:var(--text)}
#offline.warn{background:rgba(255,149,0,.1);box-shadow:inset 0 0 0 .5px rgba(255,149,0,.28);color:var(--orange-text)}
#offline.info{background:var(--accent-soft);box-shadow:inset 0 0 0 .5px rgba(0,113,227,.2);color:#0058b0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:5px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.28)}
.sim-badge{display:inline-flex;align-items:center;height:20px;margin-top:8px;padding:0 8px;border-radius:999px;background:rgba(175,82,222,.12);color:#8e44ec;font-size:10.5px;font-weight:700;letter-spacing:.03em}
.diag-head{display:flex;align-items:center;gap:14px}
.diag-head .chip-ico{width:42px;height:42px;border-radius:13px}
.diag-head .chip-ico svg{width:21px;height:21px}
.diag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.diag-grid div{padding:10px 12px;border-radius:12px;background:rgba(118,118,128,.08)}
.diag-grid b{display:block;font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.diag-grid small{color:var(--text3);font-size:11.5px}
.diag-log{margin-top:12px;height:150px;overflow:auto;padding:10px 12px;border-radius:12px;background:rgba(118,118,128,.08);font:11.5px/1.55 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--text2);white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.diag-sim{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--hair)}
.diag-sim .pill{height:30px;padding:0 12px;font-size:12.5px}

/* mises a jour */
.ver-row{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--hair);font-size:12.5px;color:var(--text2);white-space:nowrap}
.ver-row b{color:var(--text);font-weight:600}
.ver-state{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;overflow:hidden}
.ver-state > span{overflow:hidden;text-overflow:ellipsis}
.ver-state i{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.ver-state.avail{color:var(--accent);cursor:pointer;font-weight:560}
.ver-state.avail i{background:var(--accent)}
.ver-state.busy i{background:var(--orange)}
.ver-row .ibtn{width:26px;height:26px;margin-left:auto;border-radius:8px}
.ver-row .ibtn svg{width:15px;height:15px}
.ver-row .ibtn.spin-on svg{animation:sp .9s linear infinite}
.upd-btn{width:100%;margin-top:10px;height:34px}
.notes{margin-top:16px;max-height:280px;overflow:auto;padding:14px 16px;border-radius:14px;background:rgba(118,118,128,.07);color:var(--text2);font-size:13.5px;line-height:1.55;user-select:text;-webkit-user-select:text}
.notes h4{color:var(--text);font-size:14px;margin:10px 0 4px}
.notes h4:first-child{margin-top:0}
.notes ul,.notes ol{padding-left:18px;margin:4px 0}
.notes p{margin:4px 0}
.notes b{color:var(--text)}
.notes code{font:12px ui-monospace,"Cascadia Mono",Consolas,monospace;background:rgba(118,118,128,.14);padding:1px 5px;border-radius:5px}
.notes pre{background:rgba(118,118,128,.1);padding:8px 10px;border-radius:8px;overflow:auto}
.notes a{color:var(--accent)}
.upd-progress{margin-top:16px}
.upd-progress .bar{height:6px;border-radius:3px;background:rgba(118,118,128,.16);overflow:hidden}
.upd-progress .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
.upd-progress .bar.indet i{width:30%!important;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.upd-progress small{display:block;margin-top:8px;color:var(--text2);font-size:12.5px}
.upd-fail{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,59,48,.08);box-shadow:inset 0 0 0 .5px rgba(255,59,48,.22);color:#c4000f;font-size:13px}
.upd-why{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,149,0,.1);box-shadow:inset 0 0 0 .5px rgba(255,149,0,.28);color:var(--orange-text);font-size:13px}

/* fenetres plus petites */
@media (max-width:1240px){
  .route-grid,.scene-grid{grid-template-columns:minmax(0,1fr)}
  .others{grid-template-columns:1fr}
  .orow:nth-last-child(2){border-bottom:.5px solid var(--hair)}
}
@media (max-width:1100px){
  :root{--side:220px}
  .mic-grid,.light-grid{grid-template-columns:minmax(0,1fr)}
  main{padding:22px 28px 90px 8px}
  header h1{font-size:38px}
}
@media (max-width:920px){
  :root{--side:60px}
  aside{padding:16px 8px 12px;align-items:center}
  .brand{padding:0}
  .brand div,nav button span:not(.badge),.side-foot small,.ver-row,.upd-btn,#conn-txt{display:none}
  nav button{width:44px;justify-content:center;padding:0}
  nav .badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .side-foot{padding:12px 0 2px;border-top:0}
  .val{font-size:34px}
  .sl.v .sl-track{width:60px}
  .sl.v .sl-fill::after{left:20px;right:20px}
  .diag-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .strips{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:26px}
  header{flex-direction:column;align-items:flex-start}
}
</style>

</head>

    if (j.error) { sheet({icon: "warn", title: "Réglage interrompu", text: esc(j.error), actions: [["Fermer", null], ["Recommencer", function () { startJob("voice-setup", {}); }, "primary"]]}); return; }
    return showVoiceResult(j.result || {});
  }
  var ph = VOICE_PHASE[j.phase] ? j.phase : "detect", p = j.progress || 0;
  if (!(sheetState && sheetState.voice)) {
    var body = h("div");
    body.innerHTML = '<div class="vs-steps" id="vs-steps">' + VOICE_STEPS.map(function (s, i) { return '<span><i data-n="' + (i + 1) + '">' + (i + 1) + "</i>" + s[1] + "</span>"; }).join("") + "</div>" +
      '<div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="7"/><circle id="ring-p" cx="50" cy="50" r="44" fill="none" stroke="#0071E3" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" style="transition:stroke-dashoffset .2s"/></svg><div class="ico" id="vs-ico"></div></div>' +
      '<h2 id="vs-title"></h2><p id="vs-help"></p><div class="vs-read" id="vs-read">' + VOICE_READ + "</div>" +
      '<div class="sheet-meter"><div class="meter" id="sheet-meter">' + new Array(35).join("<i></i>") + '</div></div><div class="vs-status" id="vs-status"></div>';
    sheet({job: true, voice: true, body: body, actions: [["Annuler", function () { post("job-cancel"); }]]});
  }
  var idx = ph === "apply" ? 3 : VOICE_STEPS.map(function (s) { return s[0]; }).indexOf(ph);
  document.querySelectorAll("#vs-steps span").forEach(function (e, i) {
    var st = i < idx ? "done" : i === idx ? "on" : "";
    if (e._st === st) return;
    e._st = st; e.className = st;
    var n = e.querySelector("i"); n.innerHTML = st === "done" ? svg("check") : n.dataset.n;
  });
  // anneau : avancement de l'etape ; secondes restantes pendant l'ecoute de la voix et du silence
  var span = {detect: [0, .3, 0], voice: [.32, .78, 10], silence: [.78, .95, 4.7], apply: [.95, 1, 0]}[ph];
  var f = clamp((p - span[0]) / (span[1] - span[0]), 0, 1);
  var rp = $("ring-p"); if (rp) rp.setAttribute("stroke-dashoffset", 276.5 * (1 - f));
  var ico = $("vs-ico"), left = span[2] ? Math.max(1, Math.ceil((1 - f) * span[2])) : 0;
  var icoHtml = left ? '<span class="num"><b>' + left + "<small>s</small></b></span>" : svg(VOICE_PHASE[ph][0]);
  if (ico._h !== icoHtml) { ico._h = icoHtml; ico.innerHTML = icoHtml; }
  if ($("vs-title").textContent !== VOICE_PHASE[ph][1]) { $("vs-title").textContent = VOICE_PHASE[ph][1]; $("vs-help").textContent = VOICE_PHASE[ph][2]; }
  $("vs-read").classList.toggle("on", ph === "voice");
  if ($("vs-status").textContent !== (j.step || "")) $("vs-status").textContent = j.step || "";
}
function showVoiceResult(r) {
  if (!r.cal) { closeSheet(); return; }
  var c = r.cal, preset = S.meta.mic_presets[r.preset];
  var ratio = (r.comp.ratio_x >= 10 ? r.comp.ratio_x.toFixed(0) : r.comp.ratio_x.toFixed(1)).replace(".", ",") + ":1";
  var cells = [["Micro", MIC_TYPE_LONG[r.type] || r.type, ""], ["Gain", r.gain_db + " dB", "crêtes de ta voix vers \u221212 dB"],
    ["Ta voix", dbTxt(c.voice_db), "crêtes à " + dbTxt(c.voice_peak_db)], ["Bruit de la pièce", dbTxt(c.noise_peak_db), Math.round(r.snr_db) + " dB sous ta voix"],
    ["Noise gate", dbTxt(r.gate.threshold), "baisse le bruit de " + Math.abs(r.gate.attenuation_db) + " dB"], ["Compresseur", dbTxt(r.comp.threshold), ratio + " · compensation +" + r.comp.makeup + " dB"]];
  var body = h("div");
  body.innerHTML = '<div class="diag-head">' + chipIco("ok", "#30D158") + "<div><h2>Ta voix est réglée</h2><p class=\"muted-txt\">Préréglage " + esc(frLabel(preset ? preset.label : r.preset)) + ", calé sur ta voix et ta pièce. Écoute-toi pour vérifier.</p></div></div>" +
    '<div class="diag-grid vs-grid">' + cells.map(function (x) { return "<div><small>" + x[0] + "</small><b>" + esc(x[1]) + "</b>" + (x[2] ? "<em>" + esc(x[2]) + "</em>" : "") + "</div>"; }).join("") + "</div>";
  var notes = h("div", {"class": "vs-notes"});
  (r.notes || []).forEach(function (n) {
    var it = h("div", {"class": "advice"});
    it.innerHTML = chipIco(n.lvl === "ok" ? "ok" : n.lvl === "warn" ? "warn" : "bulb", n.lvl === "ok" ? "#30D158" : n.lvl === "warn" ? "#FF9F0A" : "#64D2FF");
    var b = h("div", {}, "<p>" + esc(n.t) + "</p>");
    if (n.fix) {
      var btn = h("button", {"class": "pill"}, esc(n.fix.label));
      btn.addEventListener("click", function () {
        post(n.fix.action, n.fix.body).then(function (x) { if (x && x.ok) { btn.disabled = true; btn.innerHTML = svg("check") + "Corrigé"; refresh(); } });
      });
      b.appendChild(btn);
    }
    it.appendChild(b); notes.appendChild(it);
  });
  body.appendChild(notes);
  sheet({wide: true, body: body, actions: [["M\u2019écouter", toggleListen, "listen-btn", true], ["Terminé", null, "primary"]]});
  refresh();
}
function toggleListen() {
  if (!S || !S.connected) { toast("Branche la GoXLR pour t\u2019écouter"); return; }
  var on = L && L.listening > 0;
  if (!on && S.state.mutes.Mic) { toast("Ton micro est coupé", "Réactiver", function () { post("mute", {channel: "Mic", muted: false}).then(refresh); }); return; }
  post("mic-listen", {seconds: on ? 0 : 15}).then(function (r) { if (r && r.ok && !on) toast("Tu t\u2019entends 15 secondes dans le casque, avec tes réglages"); });
}
function liveListen() {
  var left = L && L.listening > 0 ? Math.ceil(L.listening) : 0;
  var t = left ? svg("stop") + "Arrêter · " + left + " s" : svg("ear") + "M\u2019écouter";
  document.querySelectorAll(".listen-btn").forEach(function (b) { if (b._t !== t) { b._t = t; b.innerHTML = t; b.classList.toggle("on", !!left); } });
}


/* ---------- mises a jour ---------- */
var UPD_PHASE = {downloading: "Téléchargement", verifying: "Vérification de l’empreinte…", extracting: "Préparation…", applying: "Installation : GoXLR Mini redémarre, l’interface revient toute seule…"};
var UPD_WHY = {dev: "Version de développement (compilée depuis les sources) : installe la nouvelle version depuis la page de la release.",
  os: "La mise à jour intégrée fonctionne sous Windows seulement.",
  readonly: "Le dossier d’installation n’est pas modifiable : installe depuis la page de la release."};
var updShown = {};
function openUrl(u) { if (/^https:\/\//.test(u)) window.open(u, "_blank"); }
function frDate(iso) { var d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("fr-FR"); }
function mdInline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" data-ext="1">$1</a>');
}
function mdRender(src) {
  var out = [], list = null, code = null, prev = "";     // prev : "li", "p" ou "" (ligne vide, titre...)
  function close() { if (list) { out.push("</" + list + ">"); list = null; } }
  function extend(tag, txt) { var i = out.length - 1; out[i] = out[i].slice(0, -(tag.length + 3)) + " " + mdInline(txt) + "</" + tag + ">"; }
  String(src || "").replace(/\r/g, "").split("\n").forEach(function (line) {
    if (/^```/.test(line)) { if (code === null) { close(); code = []; } else { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; } prev = ""; return; }
    if (code !== null) { code.push(line); return; }
    // suite d'un point de liste (ligne indentee) ou d'un paragraphe (texte colle) : meme bloc, comme sur GitHub
    if (prev === "li" && /^\s{2,}\S/.test(line)) { extend("li", line.trim()); return; }
    if (prev === "p" && line.trim() && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|>)/.test(line)) { extend("p", line.trim()); return; }
    var m;
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push("<h4>" + mdInline(m[1]) + "</h4>"); prev = ""; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push("<li>" + mdInline(m[1]) + "</li>"); prev = "li"; }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push("<li>" + mdInline(m[1]) + "</li>"); prev = "li"; }
    else if ((m = line.match(/^>\s?(.*)/))) { close(); out.push("<p><i>" + mdInline(m[1]) + "</i></p>"); prev = ""; }
    else if (line.trim()) { close(); out.push("<p>" + mdInline(line) + "</p>"); prev = "p"; }
    else { close(); prev = ""; }
  });
  close();
  if (code !== null) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
  return out.join("") || "<p>Pas de notes pour cette version.</p>";
}
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a[data-ext]");
  if (a) { e.preventDefault(); openUrl(a.getAttribute("href")); }
});
function renderUpdate() {
  var u = S.update; if (!u) return;
  $("ver-txt").textContent = "v" + u.current;
  $("ver-txt").title = "GoXLR Mini " + u.current;
  var st = $("ver-state"), busy = u.phase && u.phase !== "failed", avail = u.status === "available" && u.latest;
  st.className = "ver-state" + (avail ? " avail" : "") + (busy ? " busy" : "");
  if (busy) st.innerHTML = "<i></i>" + (u.phase === "downloading" && u.progress != null ? "Téléchargement " + Math.round(u.progress * 100) + " %" : "Installation…");
  else if (u.phase === "failed") st.innerHTML = "<i style=\"background:var(--red)\"></i>Échec de la mise à jour";
  else if (avail) st.innerHTML = "<i></i>" + esc(u.latest.version) + " disponible";
  else if (!u.release_build) st.innerHTML = "<i style=\"background:var(--text3)\"></i>développement";
  else if (u.status === "up-to-date") st.innerHTML = "<i></i>À jour";
  else st.innerHTML = "";
  if (st.lastChild && st.lastChild.nodeType === 3) { var sp = document.createElement("span"); sp.textContent = st.lastChild.textContent; st.replaceChild(sp, st.lastChild); }
  st.title = avail ? "GoXLR Mini " + u.latest.version + " est disponible" : "";
  $("ver-check").classList.toggle("spin-on", u.status === "checking");
  $("upd-btn").style.display = avail && !busy ? "" : "none";
  if (sheetState && sheetState.update) paintUpdateSheet();
  if (u.installed && !updShown.installed) {
    updShown.installed = true;
    var ins = u.installed;
    if (ins.ok && ins.version === u.current) toast("GoXLR Mini " + ins.version + " est installé", "Nouveautés", function () { if (u.latest) openUpdateSheet(); });
    else if (!ins.ok) toast("La mise à jour vers " + ins.version + " a échoué : retour à " + ins.from_version);
    post("update-ack");
  }
  if (avail && !busy && u.latest.version !== u.reminded && !updShown[u.latest.version] && !sheetState && !(L && L.job)) {
    updShown[u.latest.version] = true;
    post("update-remind", {version: u.latest.version});
    toast("GoXLR Mini " + u.latest.version + " est disponible", "Voir", openUpdateSheet);
  }
}
function checkUpdate() {
  $("ver-check").classList.add("spin-on");
  post("update-check").then(function (r) {
    if (!r || !r.update) return;
    S.update = r.update;
    var res = r.update.result;
    if (res === "found") openUpdateSheet();
    else toast(res === "up-to-date" ? "GoXLR Mini est à jour" : res === "rate-limited" ? "GitHub limite les recherches : réessaie plus tard" : "Recherche impossible : réessaie plus tard");
    renderUpdate();
  });
}
function openUpdateSheet() {
  var u = S.update; if (!u || !u.latest) return;
  var body = h("div");
  sheet({wide: true, update: true, body: body, actions: []});
  paintUpdateSheet();
}
function paintUpdateSheet() {
  var u = S.update, b = sheetState.body, rel = u.latest || {};
  var key = JSON.stringify([u.phase, Math.round((u.progress || 0) * 50), u.error, rel.version, u.installable, u.status]);
  if (sheetState.key === key) return;
  sheetState.key = key;
  var newer = u.status === "available", busy = u.phase && u.phase !== "failed";
  var html = '<div class="diag-head">' + chipIco("download", "#0A84FF") + "<div><h2>" + (newer ? "GoXLR Mini " + esc(rel.version) + " est disponible" : "GoXLR Mini " + esc(u.current) + " est à jour") + "</h2><p class=\"muted-txt\">Installée : " + esc(u.current) + (rel.published ? " · " + esc(rel.version) + " publiée le " + frDate(rel.published) : "") + "</p></div></div>";
  html += '<div class="notes">' + mdRender(rel.notes) + "</div>";
  if (busy) {
    var pct = u.phase === "downloading" && u.progress != null ? Math.round(u.progress * 100) : null;
    html += '<div class="upd-progress"><div class="bar' + (pct == null ? " indet" : "") + '"><i style="width:' + (pct || 0) + '%"></i></div><small>' + UPD_PHASE[u.phase] + (pct != null ? " " + pct + " %" : "") + "</small></div>";
  } else if (u.phase === "failed" && u.error) {
    html += '<div class="upd-fail">' + esc(u.error.msg) + " L’ancienne version reste en place.</div>";
  } else if (newer && !u.installable) {
    html += '<div class="upd-why">' + (UPD_WHY[u.why_not] || "") + "</div>";
  }
  b.innerHTML = html;
  var acts = $("sheet-box").querySelector(".sheet-actions");
  acts.innerHTML = "";
  function btn(label, fn, cls, keep) { var x = h("button", {"class": "pill " + (cls || "")}, label); x.addEventListener("click", function () { if (!keep) closeSheet(); fn && fn(); }); acts.appendChild(x); }
  if (busy) {
    if (u.phase !== "applying") btn("Annuler", function () { post("update-cancel"); }, "", true);
    return;
  }
  btn("Voir sur GitHub", function () { openUrl(u.release_page); }, "", true);
  if (u.phase === "failed") {
    btn("Fermer", null);
    btn("Réessayer", function () { post("update-install").then(refresh); }, "primary", true);
  } else if (newer) {
    btn("Plus tard", null);
    if (u.installable) btn("Mettre à jour", function () { post("update-install").then(refresh); }, "primary", true);
    else btn("Ouvrir la page de la release", function () { openUrl(u.release_page); }, "primary");
  } else btn("Fermer", null, "primary");
}

/* ---------- rendu ---------- */
function render() {
  if (!S) return;
  var key = JSON.stringify([S.meta.outputs, S.meta.channels]);
  if (key !== metaKey) { built = {}; metaKey = key; }
  $("conn-fw").innerHTML = (S.firmware ? "Firmware " + esc(S.firmware) : "") + (S.sim ? '<br><span class="sim-badge">APPAREIL SIMULÉ</span>' : "");
  renderUpdate();
  var mm = $("hdr-mic"), mms = muteState("Mic");
  mm.innerHTML = svg(mms ? "micOff" : "Mic") + (mms ? (mms === "all" ? "Micro coupé" : "Micro " + MUTED_TXT[mms].toLowerCase()) : "Micro actif");
  mm.classList.toggle("danger", mms === "all");
  mm.classList.toggle("warn", !!mms && mms !== "all");
  if (page === "mixer") renderMixer();
  if (page === "mic") renderMic();
  if (page === "routing") renderRouting();
  if (page === "light") renderLight();
  if (page === "scenes") renderScenes(); else renderAdvice();
  var sn = S.state.scene;
  $("h-eye").textContent = (S.sim ? "Appareil simulé · " : "") + (sn && sn !== "custom" ? "Scène " + sceneLabel(sn) : "Réglage personnalisé");
}
var lastDev = 0;
function frame(t) {
  if (L && S) {
    var target = L.live.mic_db == null ? -72.2 : L.live.mic_db;
    meterShown = target > meterShown ? target : meterShown + (target - meterShown) * 0.12;
    if (target > meterPeak || t - peakT > 1200) { meterPeak = target; peakT = t; }
    if (target > -3) clipT = t;
    if (page === "mic" && built.mic) {
      meterPaint(document.querySelector("#p-mic .meter"), meterShown);
      var dbt = meterShown <= -72 ? "—" : Math.round(meterShown) + " dB";
      if ($("mic-db").textContent !== dbt) $("mic-db").textContent = dbt;
      $("mic-clip").classList.toggle("on", t - clipT < 1500);
    }
    var sm = $("sheet-meter"); if (sm) meterPaint(sm, meterShown);
    if (page === "mic" || sheetState) liveListen();
    if (liveChanged) {
      if (page === "mixer") liveMixer();
      if (page === "light" && built.light && t - lastDev > 100) { lt.dev.innerHTML = deviceSvg(); lastDev = t; liveChanged = false; }
      if (page !== "light") liveChanged = false;
    }
    liveJob();
  }
  requestAnimationFrame(frame);
}
function init() {
  document.querySelectorAll("nav button").forEach(function (b) {
    b.insertAdjacentHTML("afterbegin", svg(b.dataset.i));
    b.addEventListener("click", function () { go(b.dataset.p); });
  });
  $("fab").innerHTML = svg("more");
  $("fab").addEventListener("click", function () { if (popEl) closePop(); else openMenu(); });
  $("hdr-mic").addEventListener("click", function () { if (!S) return; toggleMute("Mic", "all"); });
  $("offline-diag").addEventListener("click", openDiag);
  document.querySelector("main").addEventListener("scroll", closePop, {passive: true});
  $("ver-check").innerHTML = svg("refresh");
  $("ver-check").addEventListener("click", checkUpdate);
  $("upd-btn").addEventListener("click", openUpdateSheet);
  $("ver-state").addEventListener("click", function () { if (S && S.update && S.update.status === "available") openUpdateSheet(); });
  $("import-file").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) { var p = JSON.parse(t); return withUndo("Configuration importée", function () { return post("profile", p).then(refresh); }); })
      .catch(function () { toast("Fichier illisible"); });
    e.target.value = "";
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePop(); if (sheetState && !sheetState.job) closeSheet(); } });
  document.addEventListener("contextmenu", function (e) { if (e.target.tagName !== "INPUT") e.preventDefault(); });
  refresh().then(function () { go(location.hash.slice(1) || "mixer"); });
  liveLoop();
  requestAnimationFrame(frame);
}
init();
