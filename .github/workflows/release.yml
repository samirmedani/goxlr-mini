name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Paquet Windows et release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Le tag correspond à la version
        shell: pwsh
        run: |
          $v = (Select-String engine/goxlrctl.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }}, version du code v$v" }
      - name: Paquet
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Notes de version
        run: python scripts/release_notes.py "${{ github.ref_name }}" --out dist/notes.md
      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/GoXLR-Mini-Setup.exe dist/GoXLR-Mini.zip dist/GoXLR-Mini.sha256 --title "GoXLR Mini ${{ github.ref_name }}" --notes-file dist/notes.md
