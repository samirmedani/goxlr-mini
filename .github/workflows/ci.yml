name: Vérification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests (simulateur)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  windows:
    name: Tests Windows et compilation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: dotnet build app/GoXLRMini.csproj -c Release

  leaks:
    name: Données personnelles et secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Données personnelles et fichiers interdits
        run: python3 scripts/leakscan.py
      - name: Secrets dans tout l'historique (gitleaks)
        run: docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh zricethezav/gitleaks:latest -c 'git config --global --add safe.directory /repo && gitleaks git /repo --no-banner --redact'
