<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>GoXLR Mini · incrustation</title>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif}
#w{position:absolute;left:16px;top:16px;display:flex;align-items:center;gap:14px;padding:14px 22px 14px 16px;border-radius:22px;
  background:rgba(18,18,22,.82);border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 40px rgba(0,0,0,.45);color:#f5f5f7;
  transform-origin:top left;opacity:0;transform:translateY(-8px) scale(var(--s,1));transition:opacity .25s,transform .25s cubic-bezier(.22,.8,.24,1),background .25s}
#w.on{opacity:1;transform:none scale(var(--s,1));transform:scale(var(--s,1))}
#w.muted{background:rgba(70,10,10,.86);border-color:rgba(255,69,58,.55)}
#ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(48,209,88,.2);color:#30D158}
#w.muted #ico{background:#FF453A;color:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,69,58,.18)}}
#ico svg{width:24px;height:24px}
b{display:block;font-size:19px;font-weight:700;letter-spacing:.01em}
small{display:block;font-size:12.5px;opacity:.7;margin-top:1px}
#m{display:none;gap:3px;height:26px;margin-left:8px;align-items:stretch}
#m i{width:5px;border-radius:2px;background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="w"><div id="ico"></div><div><b id="t">Micro actif</b><small id="s"></small></div><div id="m"></div></div>
<script>
"use strict";
var q = new URLSearchParams(location.search), always = q.get("mode") === "always", meter = q.get("meter") === "1";
var w = document.getElementById("w"), m = document.getElementById("m");
w.style.setProperty("--s", q.get("scale") || "1");
var ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>';
var OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M3.5 3.5l17 17"/></svg>';
if (meter) { m.style.display = "flex"; for (var i = 0; i < 14; i++) m.appendChild(document.createElement("i")); }
var shown = -72;
function paint(l) {
  var p = l.mic || {}, muted = p.muted || p.partial === "stream";
  w.classList.toggle("muted", !!muted);
  w.classList.toggle("on", !!(always || muted));
  document.getElementById("ico").innerHTML = muted ? OFF : ON;
  document.getElementById("t").textContent = muted ? "Micro coupé" : "Micro actif";
  document.getElementById("s").textContent = muted ? (p.muted ? "Je reviens tout de suite" : "Le stream ne m’entend pas") : (l.connected ? "" : "GoXLR hors ligne");
  if (meter) {
    var db = l.live && l.live.mic_db != null ? l.live.mic_db : -72;
    shown = db > shown ? db : shown + (db - shown) * 0.3;
    var lit = Math.round(Math.max(0, Math.min(1, (shown + 60) / 60)) * 14);
    for (var k = 0; k < 14; k++) m.children[k].style.background = k < lit && !muted ? (k > 11 ? "#FF453A" : k > 9 ? "#FFD60A" : "#30D158") : "rgba(255,255,255,.12)";
  }
}
function loop() {
  fetch("/api/live" + (meter ? "?level=1" : ""), {cache: "no-store"}).then(function (r) { return r.json(); }).then(paint)
    .catch(function () { w.classList.remove("on"); })
    .finally(function () { setTimeout(loop, meter ? 80 : 250); });
}
loop();
</script>
</body>
</html>
